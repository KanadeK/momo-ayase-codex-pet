[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "petease"
version = "0.1.1"
description = "Audit Codex pet motion and compile installable reduced-motion variants."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [
  { name = "KanadeK", email = "121669563+KanadeK@users.noreply.github.com" },
]
keywords = [
  "accessibility",
  "animation",
  "codex",
  "desktop-pet",
  "reduced-motion",
  "spritesheet",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
]
dependencies = ["Pillow>=10.0"]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "coverage[toml]>=7.6",
  "ruff>=0.9",
  "setuptools>=80",
  "wheel>=0.45",
]

[project.scripts]
petease = "petease.cli:main"

[project.urls]
Homepage = "https://github.com/KanadeK/momo-ayase-codex-pet"
Issues = "https://github.com/KanadeK/momo-ayase-codex-pet/issues"
Source = "https://github.com/KanadeK/momo-ayase-codex-pet"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.coverage.run]
branch = true
source = ["petease"]

[tool.coverage.report]
fail_under = 90
show_missing = true
