name: Bug report
description: Report a reproducible PetEase or pet package defect.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Behavior
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the exact command and sanitized output.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, and PetEase version.
    validations:
      required: true
